<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title description">
  <title id="title">Zoff application architecture</title>
  <desc id="description">
    High-level architecture showing the seven frontend applications, shared frontend packages,
    Go backend, PostgreSQL, Redis, migrator, and external music, Cast, and playlist-generation providers.
  </desc>

  <defs>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #20202a;
        --muted: #676779;
        --border: #9b9baa;
        --frontend: #e9f1ff;
        --backend: #e8f7ef;
        --storage: #f4eafa;
        --external: #fff1e8;
        --shared: #f1f1f5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #15151c;
          --foreground: #f1f1f5;
          --muted: #b5b5c1;
          --border: #666675;
          --frontend: #1f3049;
          --backend: #1d3b2d;
          --storage: #362641;
          --external: #463025;
          --shared: #292933;
        }
      }

      .canvas { fill: var(--background); }
      .boundary { fill: none; stroke: var(--border); stroke-width: 1.5; }
      .node { stroke: var(--border); stroke-width: 1.5; }
      .frontend { fill: var(--frontend); }
      .backend { fill: var(--backend); }
      .storage { fill: var(--storage); }
      .external { fill: var(--external); }
      .shared { fill: var(--shared); }
      .connector {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.5;
        marker-end: url(#arrow);
      }
      .connector-both {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.5;
        marker-start: url(#arrow-start);
        marker-end: url(#arrow);
      }
      text {
        fill: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .group-title { font-size: 15px; font-weight: 600; letter-spacing: 0.06em; }
      .title { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .detail { fill: var(--muted); font-size: 11px; text-anchor: middle; }
      .edge-label { fill: var(--muted); font-size: 10px; text-anchor: middle; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect class="canvas" width="1400" height="980"/>

  <!-- Frontend applications and shared packages -->
  <rect class="boundary" x="25" y="25" width="430" height="720" rx="14"/>
  <text class="group-title" x="47" y="56">FRONTEND APPLICATIONS</text>
  <text class="detail" x="240" y="80">Web · native mobile · television · Cast</text>

  <rect class="node frontend" x="55" y="105" width="175" height="65" rx="9"/>
  <text class="title" x="142.5" y="132">Platform</text>
  <text class="detail" x="142.5" y="153">Rooms · queue · playback</text>

  <rect class="node frontend" x="250" y="105" width="175" height="65" rx="9"/>
  <text class="title" x="337.5" y="132">Admin</text>
  <text class="detail" x="337.5" y="153">Rooms · users · operations</text>

  <rect class="node frontend" x="55" y="190" width="175" height="65" rx="9"/>
  <text class="title" x="142.5" y="217">Embed</text>
  <text class="detail" x="142.5" y="238">Embeddable room player</text>

  <rect class="node frontend" x="250" y="190" width="175" height="65" rx="9"/>
  <text class="title" x="337.5" y="217">Remote</text>
  <text class="detail" x="337.5" y="238">Paired web controller</text>

  <rect class="node frontend" x="55" y="275" width="175" height="65" rx="9"/>
  <text class="title" x="142.5" y="302">Cast receiver</text>
  <text class="detail" x="142.5" y="323">Chromecast playback</text>

  <rect class="node frontend" x="250" y="275" width="175" height="65" rx="9"/>
  <text class="title" x="337.5" y="302">Mobile</text>
  <text class="detail" x="337.5" y="323">Expo · iOS · Android</text>

  <rect class="node frontend" x="55" y="360" width="370" height="70" rx="9"/>
  <text class="title" x="240" y="388">TV</text>
  <text class="detail" x="240" y="411">Expo Android TV · Samsung Tizen renderer</text>

  <text class="group-title" x="55" y="475">SHARED FRONTEND PACKAGES</text>

  <rect class="node shared" x="55" y="495" width="370" height="55" rx="9"/>
  <text class="title" x="240" y="518">@vibes/api · @vibes/models</text>
  <text class="detail" x="240" y="538">Typed REST and SSE · schemas and domain types</text>

  <rect class="node shared" x="55" y="570" width="370" height="55" rx="9"/>
  <text class="title" x="240" y="593">@vibes/shared · @vibes/ui</text>
  <text class="detail" x="240" y="613">State and utilities · web, native, and shared renderers</text>

  <rect class="node shared" x="55" y="645" width="370" height="55" rx="9"/>
  <text class="title" x="240" y="668">Serve · Tailwind · iconography</text>
  <text class="detail" x="240" y="688">SSR runtime · styling · generated icon exports</text>

  <!-- Go backend -->
  <rect class="boundary" x="510" y="25" width="370" height="720" rx="14"/>
  <text class="group-title" x="532" y="56">VIBES BACKEND</text>
  <text class="detail" x="695" y="80">Single Go application</text>

  <rect class="node backend" x="550" y="105" width="290" height="185" rx="10"/>
  <text class="title" x="695" y="137">Public API</text>
  <text class="detail" x="695" y="164">Rooms · songs · playlists · search</text>
  <text class="detail" x="695" y="185">playback · settings · authorization</text>
  <text class="detail" x="695" y="206">remote pairing and control</text>
  <text class="detail" x="695" y="242">HTTP endpoints and SSE updates</text>
  <text class="detail" x="695" y="263">shared by every frontend application</text>

  <rect class="node backend" x="550" y="325" width="290" height="110" rx="10"/>
  <text class="title" x="695" y="357">Application events</text>
  <text class="detail" x="695" y="382">Playlist generation · playback progression</text>
  <text class="detail" x="695" y="403">provider refresh · cleanup · maintenance</text>

  <rect class="node backend" x="550" y="470" width="290" height="100" rx="10"/>
  <text class="title" x="695" y="502">External integrations</text>
  <text class="detail" x="695" y="527">Music search and metadata</text>
  <text class="detail" x="695" y="548">Playlist-generation providers</text>

  <rect class="node backend" x="550" y="605" width="290" height="80" rx="10"/>
  <text class="title" x="695" y="636">Server wiring and domain interfaces</text>
  <text class="detail" x="695" y="660">Handlers depend on minimal vibe interfaces</text>

  <!-- External platforms and providers -->
  <rect class="boundary" x="935" y="25" width="440" height="720" rx="14"/>
  <text class="group-title" x="957" y="56">EXTERNAL PLATFORMS AND PROVIDERS</text>

  <rect class="node external" x="970" y="105" width="370" height="110" rx="9"/>
  <text class="title" x="1155" y="136">Music providers</text>
  <text class="detail" x="1155" y="162">YouTube · SoundCloud</text>
  <text class="detail" x="1155" y="184">Search and metadata APIs · official client players</text>

  <rect class="node external" x="970" y="325" width="370" height="90" rx="9"/>
  <text class="title" x="1155" y="356">Playlist-generation providers</text>
  <text class="detail" x="1155" y="382">xAI Grok · Google Gemini</text>

  <rect class="node external" x="970" y="505" width="370" height="90" rx="9"/>
  <text class="title" x="1155" y="536">Google Cast platform</text>
  <text class="detail" x="1155" y="562">Sender SDK · receiver runtime · media messages</text>

  <!-- Application and provider connections -->
  <path class="connector-both" d="M 455 197 L 550 197"/>
  <text class="edge-label" x="502.5" y="185">HTTPS + SSE</text>

  <path class="connector-both" d="M 840 160 L 970 160"/>
  <text class="edge-label" x="905" y="148">Provider APIs</text>

  <path class="connector-both" d="M 840 370 L 970 370"/>
  <text class="edge-label" x="905" y="358">Generation API</text>

  <path class="connector-both" d="M 455 550 L 500 550 L 500 720 L 910 720 L 910 550 L 970 550"/>
  <text class="edge-label" x="705" y="710">Official provider players and Cast SDK</text>

  <!-- Data stores -->
  <text class="group-title" x="25" y="805">DATA AND SCHEMA</text>

  <rect class="node backend" x="55" y="845" width="240" height="70" rx="9"/>
  <text class="title" x="175" y="874">Vibes migrator</text>
  <text class="detail" x="175" y="897">PostgreSQL schema migrations</text>

  <path class="node storage" d="M 390 839 C 390 819, 650 819, 650 839 L 650 901 C 650 921, 390 921, 390 901 Z"/>
  <ellipse class="node storage" cx="520" cy="839" rx="130" ry="20"/>
  <path class="boundary" d="M 390 901 C 390 921, 650 921, 650 901"/>
  <text class="title" x="520" y="871">PostgreSQL</text>
  <text class="detail" x="520" y="893">Rooms · songs · playback · users</text>

  <path class="node storage" d="M 790 839 C 790 819, 1070 819, 1070 839 L 1070 901 C 1070 921, 790 921, 790 901 Z"/>
  <ellipse class="node storage" cx="930" cy="839" rx="140" ry="20"/>
  <path class="boundary" d="M 790 901 C 790 921, 1070 921, 1070 901"/>
  <text class="title" x="930" y="871">Redis</text>
  <text class="detail" x="930" y="893">App-event streams · cache · rate limits · statistics</text>

  <path class="connector" d="M 295 880 L 390 880"/>
  <path class="connector-both" d="M 650 745 L 650 790 L 520 790 L 520 819"/>
  <path class="connector-both" d="M 740 745 L 740 790 L 930 790 L 930 819"/>
  <text class="edge-label" x="342.5" y="868">schema</text>
</svg>
