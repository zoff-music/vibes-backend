name: security

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    if: github.repository == 'zoff-music/vibes-backend' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate documentation
        run: make docs
      - name: Security checks
        run: make security
