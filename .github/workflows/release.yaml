name: release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    if: github.repository == 'zoff-music/vibes-backend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate documentation
        run: make docs
      - name: Security checks
        run: make security

  build:
    needs: security
    if: github.repository == 'zoff-music/vibes-backend' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Image tags
        id: image
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_version="main-$(date -u +%Y%m%d%H%M%S)-${RELEASE_SHA}"
          echo "sha=${image_repository}:${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${image_repository}:${image_version}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.version }}
